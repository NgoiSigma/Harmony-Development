const LETTER_OPS = {
  "А":{role:"I",weight:0.85,layer:1}, "Б":{role:"O",weight:0.55,layer:2},
  "В":{role:"C",weight:0.70,layer:3}, "Г":{role:"D",weight:0.50,layer:3},

  "М":{role:"O",weight:0.50,layer:2}, "Н":{role:"R",weight:-0.20,layer:4},
  "О":{role:"O",weight:0.65,layer:2}, "П":{role:"D",weight:0.40,layer:7},
  "Р":{role:"F",weight:0.80,layer:5}, "С":{role:"C",weight:0.65,layer:3},
  "Т":{role:"D",weight:0.55,layer:7}, "У":{role:"M",weight:0.30,layer:5},
  "Ф":{role:"M",weight:0.20,layer:5}, "Х":{role:"R",weight:-0.50,layer:4},
  "Ц":{role:"I",weight:0.45,layer:1}, "Ч":{role:"R",weight:-0.25,layer:4},
  "Ш":{role:"F",weight:0.35,layer:5}, "Щ":{role:"F",weight:0.30,layer:5},
  "Ъ":{role:"M",weight:0.10,layer:6}, "Ы":{role:"M",weight:0.15,layer:6},
  "Ь":{role:"M",weight:0.10,layer:6}, "Э":{role:"I",weight:0.30,layer:1},
  "Ю":{role:"C",weight:0.50,layer:3}, "Я":{role:"I",weight:0.70,layer:1},
  "Ё":{role:"I",weight:0.40,layer:1}, "І":{role:"C",weight:0.55,layer:3},
  "Ї":{role:"C",weight:0.50,layer:3}, "Є":{role:"C",weight:0.45,layer:3},
};
const LATIN_OPS = {
  A:{role:"I",weight:0.80,layer:1}, B:{role:"O",weight:0.50,layer:2},
  C:{role:"R",weight:-0.30,layer:4},D:{role:"D",weight:0.50,layer:7},
  E:{role:"C",weight:0.45,layer:3}, F:{role:"M",weight:0.20,layer:5},
  G:{role:"D",weight:0.45,layer:3}, H:{role:"M",weight:0.15,layer:6},
  I:{role:"C",weight:0.55,layer:3}, J:{role:"M",weight:0.20,layer:5},
  K:{role:"R",weight:-0.40,layer:4},L:{role:"C",weight:0.70,layer:3},
  M:{role:"O",weight:0.50,layer:2}, N:{role:"R",weight:-0.20,layer:4},
  O:{role:"O",weight:0.65,layer:2}, P:{role:"D",weight:0.40,layer:7},
  Q:{role:"R",weight:-0.35,layer:4},R:{role:"F",weight:0.75,layer:5},
  S:{role:"C",weight:0.60,layer:3}, T:{role:"D",weight:0.55,layer:7},
  U:{role:"M",weight:0.30,layer:5}, V:{role:"C",weight:0.55,layer:3},
  W:{role:"F",weight:0.40,layer:5}, X:{role:"R",weight:-0.50,layer:4},
  Y:{role:"I",weight:0.35,layer:1}, Z:{role:"R",weight:-0.30,layer:4},
};
function lookupOp(ch) {
  const u = ch.toUpperCase();
  if (LETTER_OPS[u]) return { letter: u, ...LETTER_OPS[u] };
  if (LATIN_OPS[u]) return { letter: u, ...LATIN_OPS[u] };
  return null;
}
function decompose(text) {
  const ops = [];
  for (const ch of text) { const op = lookupOp(ch); if (op) ops.push(op); }
  if (ops.length === 0) return null;
  const sum = ops.reduce((s,o) => s + o.weight, 0);
  const avg = sum / ops.length;
  const variance = ops.reduce((s,o) => s + Math.pow(o.weight - avg, 2), 0) / ops.length;
  const coherence = Math.max(0, 1 - variance);
  const layerHist = Array(7).fill(0);
  for (const o of ops) layerHist[o.layer - 1] += Math.abs(o.weight);
  return { ops, sum, avg, coherence, layerHist };
}

// ═══════════════════════════════════════════════════════════════════════════
// Лексер и парсер «Гармонии»
// ═══════════════════════════════════════════════════════════════════════════
const KEYWORDS = new Set([
  "элемент","связь","цель","функция","управление","если","тогда","иначе",
  "взаимодействие","передача_данных","самоотображение","руководство",
  "диалектическое_противоречие","разрешение_противоречия",
  "моделирование_среды","взаимодействие_с_средой","с","через",
  "клевер","обогащает","среду","проверка",
]);
function tokenize(src) {
  const tokens = []; let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === "/" && src[i+1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (ch === "{" || ch === "}") { tokens.push({type:"brace",value:ch}); i++; continue; }
    if (ch === '"') {
      let j = i+1, s = "";
      while (j < src.length && src[j] !== '"') { s += src[j]; j++; }
      tokens.push({type:"string",value:s}); i = j+1; continue;
    }
    const m = src.slice(i).match(/^[\p{L}_][\p{L}0-9_]*/u);
    if (m) {
      const w = m[0];
      tokens.push({type: KEYWORDS.has(w.toLowerCase()) ? "keyword" : "ident", value: w});
      i += w.length; continue;
    }
    const n = src.slice(i).match(/^[0-9]+(\.[0-9]+)?/);
    if (n) { tokens.push({type:"number",value:Number(n[0])}); i += n[0].length; continue; }
    tokens.push({type:"punct",value:ch}); i++;
  }
  return tokens;
}
function parse(tokens) {
  const ast = { type: "Program", body: [] };
  let p = 0;
  const peek = () => tokens[p];
  const eat  = () => tokens[p++];
  while (p < tokens.length) {
    const t = peek(); if (!t) break;
    const lower = (t.value || "").toString().toLowerCase();
    if (t.type === "keyword" && lower === "элемент") { eat(); const name = eat(); ast.body.push({type:"Element", name: name?.value}); }
    else if (t.type === "keyword" && lower === "связь") { eat(); const a = eat(); const sKw = eat(); const b = eat(); ast.body.push({type:"Link", from: a?.value, to: b?.value, via: sKw?.value}); }
    else if (t.type === "keyword" && lower === "цель") { eat(); const name = eat(); ast.body.push({type:"Goal", name: name?.value}); }
    else if (t.type === "keyword" && lower === "функция") {
      eat(); const name = eat(); let body = [];
      if (peek()?.value === "{") {
        eat();
        while (peek() && peek().value !== "}") body.push(eat());
        if (peek()?.value === "}") eat();
      }
      ast.body.push({type:"Function", name: name?.value, bodyTokens: body});
    }
    else if (t.type === "keyword" && lower === "клевер") {
      eat(); let predicate = null;
      while (peek() && peek().value !== "{") eat();
      if (peek()?.value === "{") {
        eat(); const inner = [];
        while (peek() && peek().value !== "}") inner.push(eat());
        if (peek()?.value === "}") eat();
        predicate = inner.map(t => t.value).join(" ");
      }
      ast.body.push({type:"CloverCheck", predicate});
    } else { eat(); }
  }
  return ast;
}
function interpret(ast, t) {
  const log = []; let cloverResult = null;
  for (const node of ast.body) {
    if (node.type === "Element") log.push(`+ элемент :: «${node.name}» зарегистрирован`);
    else if (node.type === "Link") log.push(`↔ связь :: ${node.from} ⇌ ${node.to}`);
    else if (node.type === "Goal") log.push(`◎ цель :: ${node.name}`);
    else if (node.type === "Function") log.push(`λ функция :: ${node.name}() определена`);
    else if (node.type === "CloverCheck") {
      const p = (node.predicate || "").toLowerCase();
      const enriches = p.includes("обогащает") || p.includes("enrich");
      const negated = /\bне\b|\bnot\b/.test(p);
      cloverResult = enriches && !negated;
      log.push(`✦ ${t.parser.cloverHeader.toUpperCase()} :: ${cloverResult ? t.parser.cloverYes : t.parser.cloverNo}`);
    }
  }
  return { log, cloverResult };
}

function RadarChart({ values, labels }) {
  const N = values.length;
  const cx = 220, cy = 220, R = 170;
  const points = values.map((v, i) => {
    const a = (i/N)*2*Math.PI - Math.PI/2;
    const r = (v/100)*R;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  });
  const path = "M " + points.map(p => p.join(",")).join(" L ") + " Z";
  return (
    <div className="card" style={{ display: "flex", justifyContent: "center" }}>
      <svg viewBox="0 0 440 440" style={{ maxWidth: 440, width: "100%", height: "auto" }}>
        {[0.25,0.5,0.75,1].map((s, i) => (

          const a = (i/N)*2*Math.PI - Math.PI/2;

        {points.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="#e8d77a"></circle>)}
        {labels.map((l, i) => {
          const a = (i/N)*2*Math.PI - Math.PI/2;
          const tx = cx + (R+22)*Math.cos(a);
          const ty = cy + (R+22)*Math.sin(a);
          return <text key={i} x={tx} y={ty} fill="#888" fontSize="11" textAnchor="middle" dominantBaseline="middle">{l}</text>;
        })}
      </svg>
    </div>
  );
}
function DashboardPanel({ t }) {
  const [tone, setTone] = useState(72);
  const [project, setProject] = useState(58);
  const sectorVals = useMemo(
    () => Array.from({length:12},(_,i) => 30 + Math.round(50*Math.abs(Math.sin((i+1)*1.7 + tone*0.1)))),
    [tone]
  );
  const coh = useMemo(() => Math.max(0, 100 - Math.abs(tone - project)*1.4), [tone, project]);
  return (
    <div>
      <div className="card-label" style={{ marginBottom: 16 }}>{t.dash.header}</div>
      <div className="grid grid-3" style={{ marginBottom: 24 }}>
        <Card label={t.dash.tone}>
          <div style={{ fontSize: 32, color: "#e8d77a", fontWeight: 300 }}>{tone}</div>
          <input type="range" min={0} max={100} value={tone} onChange={e => setTone(Number(e.target.value))} style={{ accentColor: "#e8d77a", marginTop: 8 }} />
        </Card>
        <Card label={t.dash.project}>
          <div style={{ fontSize: 32, color: "#9bc77a", fontWeight: 300 }}>{project}</div>
          <input type="range" min={0} max={100} value={project} onChange={e => setProject(Number(e.target.value))} style={{ accentColor: "#9bc77a", marginTop: 8 }} />
        </Card>
        <Card label={t.dash.coherence}>
          <div style={{ fontSize: 32, fontWeight: 300, color: coh > 70 ? "#9bc77a" : coh > 40 ? "#e8d77a" : "#c77a7a" }}>
            {coh.toFixed(0)}%
          </div>
          <CoherenceBar value={coh/100} />
        </Card>
      </div>
      <div className="card-label" style={{ marginBottom: 12 }}>{t.dash.sectors}</div>
      <RadarChart values={sectorVals} labels={t.dash.sectorNames} />
      <div className="info-strip" style={{ marginTop: 16 }}>ⓘ {t.dash.legend}</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// КОРНЕВОЙ КОМПОНЕНТ
// ═══════════════════════════════════════════════════════════════════════════
function App() {
  const [lang, setLang] = useState("ru");
  const [tab, setTab]   = useState("op");
  const t = I18N[lang];
  const isRTL = RTL_LANGS.has(lang);

  React.useEffect(() => {
    document.documentElement.dir = isRTL ? "rtl" : "ltr";
    document.documentElement.lang = lang;
  }, [lang, isRTL]);

  const langs = [
    { code: "ru", label: "RU" }, { code: "en", label: "EN" }, { code: "de", label: "DE" },
    { code: "es", label: "ES" }, { code: "zh", label: "中" }, { code: "ar", label: "AR" }, { code: "he", label: "HE" },
  ];
  const tabs = [
    { key: "op", label: t.tabs.op },
    { key: "parser", label: t.tabs.parser },
    { key: "sim", label: t.tabs.sim },
    { key: "dash", label: t.tabs.dash },
  ];

  return (
    <>
      <header className="top">
        <div>
          <h1 className="title">⫷ {t.title} ⫸</h1>
          <div className="subtitle">NOVEYA · {t.subtitle}</div>
        </div>
        <div className="lang-switch">
          {langs.map(l => (
            <button key={l.code} className={"lang-btn " + (lang === l.code ? "active" : "")} onClick={() => setLang(l.code)}>
              {l.label}
            </button>
          ))}
        </div>
      </header>

      <div className="tabs">
        {tabs.map(it => (
          <button key={it.key} className={"tab " + (tab === it.key ? "active" : "")} onClick={() => setTab(it.key)}>
            {it.label}
          </button>
        ))}
      </div>

      <main>
        {tab === "op"     && <LetterOperatorPanel t={t} lang={lang} />}
        {tab === "parser" && <ParserPanel t={t} />}
        {tab === "sim"    && <SimulatorPanel t={t} />}
        {tab === "dash"   && <DashboardPanel t={t} />}
      </main>

      <footer className="bottom">ⓘ {t.disclaimer}</footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
